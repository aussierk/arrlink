services:
  arrlink:
    image: ghcr.io/yourname/arrlink:latest
    build: .
    container_name: arrlink
    ports:
      - "8270:8270"
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/Toronto
      LOG_LEVEL: info
      CONFIG_DIR: /config
      # Default: open (LAN). Password and OIDC login are independent and can
      # both be enabled at once — see .env.example for the full list.
      AUTH_PASSWORD_ENABLED: "false"
      # UI_USERNAME: admin
      # UI_PASSWORD: change-me
      AUTH_OIDC_ENABLED: "false"
      # OIDC_ISSUER: https://<provider>/application/o/<app>/
      # OIDC_CLIENT_ID: <client-id>
      # OIDC_CLIENT_SECRET: <client-secret>
      # OIDC_AUTO_LOGIN: "true"
    volumes:
      - ./arrlink/config:/config
      # Writable link root on the SAME pool as the media (default allowed root
      # is /media). Presets link under /media/movies and /media/tv by default.
      # - /mnt/tank/arrlink-links:/media
      # Read-only media, at the SAME absolute paths Radarr/Sonarr see them
      # (required so ArrLink can stat/link the source files).
      # - /mnt/tank/media:/mnt/tank/media:ro
    restart: unless-stopped
