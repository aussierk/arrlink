services:
  arrlink:
    image: ghcr.io/aussierk/arrlink:latest
    build: .
    container_name: arrlink
    env_file: .env
    ports:
      - "8270:8270"
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/Toronto
      # Must stay /config (matches the volume mount below) regardless of
      # .env — .env.example's CONFIG_DIR=./config is for local, non-Docker
      # dev, so it's deliberately kept out of .env's reach here (an explicit
      # `environment:` entry always wins over env_file for the same key).
      CONFIG_DIR: /config
    volumes:
      - ./arrlink/config:/config
      # Writable link root on the SAME pool as the media (default allowed root
      # is /media). Presets link under /media/movies and /media/tv by default.
      # - /mnt/tank/arrlink-links:/media
      # Read-only media, at the SAME absolute paths Radarr/Sonarr see them
      # (required so ArrLink can stat/link the source files).
      # - /mnt/tank/media:/mnt/tank/media:ro
    restart: unless-stopped
